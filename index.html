<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>集結着時間計算ツール</title>

<style>
body { font-family: Arial; margin: 30px; }
.topBar { display:flex; gap:20px; margin-bottom:20px; }

.manual {
  display:none;
  border:2px solid #888;
  padding:15px;
  margin-bottom:15px;
  background:#f9f9f9;
  line-height:1.6;
}

.headerRow { display:flex; gap:40px; margin-bottom:10px; }

.label {
  padding:8px 16px;
  border-radius:8px;
  border:2px solid #6c8ebf;
  background:#dbe5f1;
  font-weight:bold;
}
.label.orange { border-color:#c68c00; background:#ffe8b3; }

.block {
  border:3px solid black;
  padding:15px;
  margin-bottom:20px;
  position:relative;
}

.delete {
  position:absolute;
  right:10px;
  top:10px;
  background:red;
  color:white;
  border:none;
}

.mainRow { display:flex; gap:40px; align-items:flex-start; }

.userBox { width:180px; }

.calcBox {
  width:200px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.calcRow { display:flex; gap:5px; align-items:center; }
.bar { border-top:3px solid black; }

.facilityBox { display:flex; flex-direction:column; gap:10px; }
.facilityRow { display:flex; gap:10px; align-items:center; }

.time { width:100px; font-weight:bold; }

input { padding:5px; width:130px; }

.manualBtn { margin-bottom: 15px; }

button {
  padding:8px 15px;
  border-radius:8px;
  background:#ddd;
  border:1px solid #888;
  cursor:pointer;
}
</style>

</head>

<body>

<h1>集結着時間計算ツール</h1>

<button onclick="toggleManual()" class="manualBtn">取扱説明書</button>

<div id="manual" class="manual">
  ■使い方<br>
  ・入力内容は自動保存され、ページ更新しても保持されます。<br>
</div>

<div class="topBar">
  施設数：
  <input type="number" id="facilityCount" value="3" min="1">
  <button onclick="resetAll()">全リセット</button>
</div>

<div class="headerRow">
  <div class="label">ユーザー名</div>
  <div class="label">集結完了時刻</div>
  <div class="label">施設名</div>
  <div class="label">行軍時間</div>
  <div class="label orange">到達時間</div>
</div>

<div id="container"></div>

<button onclick="addBlock()">＋ プレイヤーを追加</button>

<script>

// ===== 説明トグル =====
function toggleManual(){
  const m = document.getElementById("manual");
  m.style.display = (m.style.display === "none") ? "block" : "none";
}

// ===== ローカル保存 =====
function saveToLocalStorage(){
  const data = {
    facilityCount: facilityCount.value,
    players: []
  };

  document.querySelectorAll(".block").forEach(block=>{
    let obj = {
      player: block.querySelector(".player").value,
      now: block.querySelector(".now").value,
      remain: block.querySelector(".remain").value,
      gather: block.querySelector(".gather").value,
      facilities: []
    };

    block.querySelectorAll(".facilityRow").forEach(row=>{
      obj.facilities.push({
        name: row.querySelector(".fname").value,
        time: row.querySelector(".ftime").value
      });
    });

    data.players.push(obj);
  });

  localStorage.setItem("rallyToolData", JSON.stringify(data));
}

function loadFromLocalStorage(){
  const data = JSON.parse(localStorage.getItem("rallyToolData"));
  if(!data) return;

  facilityCount.value = data.facilityCount || 3;

  container.innerHTML = "";

  data.players.forEach(p=>{
    let block = createBlock();

    block.querySelector(".player").value = p.player;
    block.querySelector(".now").value = p.now;
    block.querySelector(".remain").value = p.remain;
    block.querySelector(".gather").value = p.gather;

    let rows = block.querySelectorAll(".facilityRow");
    p.facilities.forEach((f,i)=>{
      if(rows[i]){
        rows[i].querySelector(".fname").value = f.name;
        rows[i].querySelector(".ftime").value = f.time;
      }
    });

    container.appendChild(block);
    calc(block);
  });
}

// ===== 時間処理 =====
function formatTimeInput(value, isDelete=false){
  let n=value.replace(/\D/g,"").slice(0,6);

  if(isDelete){
    if(n.length<=2)return n;
    if(n.length<=4)return n.slice(0,2)+":"+n.slice(2);
    return n.slice(0,2)+":"+n.slice(2,4)+":"+n.slice(4);
  }

  let result="";
  if(n.length>=2) result+=n.slice(0,2)+":";
  else return n;

  if(n.length>=4) result+=n.slice(2,4)+":";
  else if(n.length>2) return result+n.slice(2);
  else return result;

  if(n.length>4) result+=n.slice(4);
  return result;
}

function toSec(t){
  let p=t.split(":");
  if(p.length!==3)return null;
  return p[0]*3600+p[1]*60+p[2]*1;
}

function toStr(s){
  s=(s+86400)%86400;
  let h=Math.floor(s/3600);
  let m=Math.floor((s%3600)/60);
  let sec=s%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

// ===== ブロック生成 =====
function createBlock(){
  let fc = Math.max(1, Number(facilityCount.value));

  let div=document.createElement("div");
  div.className="block";

  let html=`
  <button class="delete" onclick="removeBlock(this)">削除</button>

  <div class="mainRow">

    <div class="userBox">
      <input class="player" placeholder="ユーザー名">
    </div>

    <div class="calcBox">
      <input class="now" placeholder="現在時刻">
      <div class="calcRow">
        <span>+</span>
        <input class="remain" placeholder="残り時間">
      </div>
      <div class="bar"></div>
      <input class="gather" placeholder="集結完了時刻">
    </div>

    <div class="facilityBox">
  `;

  for(let i=0;i<fc;i++){
    html+=`
      <div class="facilityRow">
        <input class="fname" placeholder="施設名">
        <input class="ftime" placeholder="行軍時間">
        <div class="time">--:--:--</div>
      </div>
    `;
  }

  html+=`</div></div>`;
  div.innerHTML=html;

  div.querySelectorAll("input").forEach(input=>{
    let isDelete=false;

    input.addEventListener("keydown",e=>{
      isDelete=(e.key==="Backspace");
    });

    input.addEventListener("input",()=>{
      if(input.classList.contains("now") ||
         input.classList.contains("remain") ||
         input.classList.contains("gather") ||
         input.classList.contains("ftime")){
        input.value=formatTimeInput(input.value,isDelete);
      }
      calc(div);
      saveToLocalStorage();
    });
  });

  return div;
}

// ===== 計算 =====
function calc(block){
  let now=block.querySelector(".now").value;
  let rem=block.querySelector(".remain").value;
  let gatherInput=block.querySelector(".gather");

  let g=null;

  if(now.length===8 && rem.length===8){
    g=toSec(now)+toSec(rem);
    gatherInput.value=toStr(g);
  }else if(gatherInput.value.length===8){
    g=toSec(gatherInput.value);
  }

  if(g===null)return;

  block.querySelectorAll(".facilityRow").forEach(r=>{
    let t=r.querySelector(".ftime").value;
    let out=r.querySelector(".time");

    if(t.length!==8){
      out.innerText="--:--:--";
      return;
    }

    out.innerText=toStr(g+toSec(t));
  });
}

// ===== 操作 =====
function addBlock(){
  container.appendChild(createBlock());
  saveToLocalStorage();
}

function removeBlock(btn){
  if(container.children.length===1)return;
  btn.closest(".block").remove();
  saveToLocalStorage();
}

function resetAll(){
  container.innerHTML="";
  localStorage.removeItem("rallyToolData");
  addBlock();
}

// ★ 修正済み（重要）
facilityCount.addEventListener("change",()=>{
  let val = Number(facilityCount.value);

  if(!val || val < 1){
    facilityCount.value = 1;
  }

  // 現在状態を維持して再生成
  let temp = JSON.parse(localStorage.getItem("rallyToolData"));
  saveToLocalStorage();
  loadFromLocalStorage();
});

// 初期化
window.onload = () => {
  loadFromLocalStorage();
  if(container.children.length === 0){
    addBlock();
  }
};

</script>

</body>
</html>
